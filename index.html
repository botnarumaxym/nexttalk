<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextTalk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0f172a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .chat-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .chat-header { padding: 16px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .chat-title { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }
    #typing-status { font-size: 0.8rem; color: #38bdf8; font-style: italic; min-height: 1.1rem; }
    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0f172a; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #0284c7; color: #ffffff; border-bottom-right-radius: 2px; }
    .msg.admin { align-self: flex-start; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-bottom-left-radius: 2px; }
    .msg-time { font-size: 0.7rem; opacity: 0.75; text-align: right; margin-top: 4px; }
    .input-container { padding: 14px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; }
    #message-input { flex: 1; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 24px; color: white; outline: none; }
    #message-input:focus { border-color: #38bdf8; }
    #send-btn { background: #0284c7; color: white; border: none; padding: 0 20px; border-radius: 24px; font-weight: bold; cursor: pointer; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div>
        <div class="chat-title">NextTalk</div>
        <div id="typing-status"></div>
      </div>
    </div>

    <div class="messages-container" id="messages-container"></div>

    <div class="input-container">
      <input type="text" id="message-input" placeholder="Напишіть повідомлення..." autocomplete="off">
      <button id="send-btn">Надіслати</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBuGDd0y2y4Tkf-tcBU_ZshX2uUGK3uQWQ",
      authDomain: "my-website-5d781.firebaseapp.com",
      databaseURL: "https://my-website-5d781-default-rtdb.firebaseio.com",
      projectId: "my-website-5d781",
      storageBucket: "my-website-5d781.firebasestorage.app",
      messagingSenderId: "111570797151",
      appId: "1:111570797151:web:5d23161a445c946ccb51ea"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let userId = localStorage.getItem('nexttalk_user_id');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('nexttalk_user_id', userId);
    }

    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const typingStatus = document.getElementById('typing-status');

    let typingTimeout = null;

    // Індикатор вводу тексту від клієнта
    messageInput.addEventListener('input', () => {
      database.ref('chats/' + userId + '/userTyping').set(true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        database.ref('chats/' + userId + '/userTyping').set(false);
      }, 1500);
    });

    // Слухаємо, чи друкує Адмін
    database.ref('chats/' + userId + '/adminTyping').on('value', snapshot => {
      if (snapshot.val() === true) {
        typingStatus.textContent = 'Максим друкує...';
      } else {
        typingStatus.textContent = '';
      }
    });

    // Слухаємо нові повідомлення
    database.ref('chats/' + userId + '/messages').on('value', snapshot => {
      messagesContainer.innerHTML = '';
      const data = snapshot.val();
      if (!data) return;

      Object.values(data).forEach(msg => {
        const div = document.createElement('div');
        const isMe = msg.sender === 'user';
        div.className = 'msg ' + (isMe ? 'user' : 'admin');
        div.innerHTML = `
          <div>${msg.text}</div>
          <div class="msg-time">${msg.timestamp || ''}</div>
        `;
        messagesContainer.appendChild(div);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });

    // Відправка повідомлення
    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      database.ref('chats/' + userId + '/userTyping').set(false);
      database.ref('chats/' + userId + '/messages').push({
        sender: 'user',
        text: text,
        timestamp: new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' })
      });

      messageInput.value = '';
    }

    sendBtn.onclick = sendMessage;
    messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
  </script>
</body>
</html>
