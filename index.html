<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextTalk</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

    /* Головний контейнер додатка */
    .app-container { width: 100%; max-width: 480px; height: 100vh; background: #1e293b; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    @media (min-width: 500px) {
      .app-container { height: 90vh; border-radius: 16px; border: 1px solid #334155; }
    }

    /* === 1. ЕКРАН СПИСКУ ЧАТІВ === */
    #chats-screen { display: flex; flex-direction: column; width: 100%; height: 100%; }
    
    .app-header { padding: 16px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .app-title { font-size: 1.25rem; font-weight: 700; color: #38bdf8; letter-spacing: 0.5px; }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-card { padding: 14px 18px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: background 0.2s; }
    .chat-card:hover { background: #334155; }

    .avatar { width: 48px; height: 48px; border-radius: 50%; background: #0284c7; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 1.2rem; flex-shrink: 0; }
    .chat-info { flex: 1; overflow: hidden; }
    .chat-name { font-weight: 600; font-size: 1rem; color: #f8fafc; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .chat-time { font-size: 0.75rem; color: #94a3b8; font-weight: normal; }
    .chat-preview { font-size: 0.85rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* === 2. ЕКРАН ЧАТУ (ПРИХОВАНИЙ ЗА МОУВЧАННЯМ) === */
    #conversation-screen { display: none; flex-direction: column; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #0f172a; z-index: 10; }
    #conversation-screen.active { display: flex; }

    .chat-header { padding: 12px 16px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
    .back-btn { background: none; border: none; color: #38bdf8; font-size: 1.5rem; cursor: pointer; padding: 0 8px; }
    
    .status { font-size: 0.75rem; color: #22c55e; display: flex; align-items: center; gap: 4px; }

    /* Область повідомлень */
    #messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0f172a; }
    
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 0.93rem; line-height: 1.4; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #0284c7; color: #ffffff; border-bottom-right-radius: 2px; }
    .msg.admin { align-self: flex-start; background: #1e293b; color: #f8fafc; border-bottom-left-radius: 2px; border: 1px solid #334155; }
    .msg-author { font-size: 0.75rem; font-weight: 600; margin-bottom: 3px; color: #38bdf8; }
    .msg-time { font-size: 0.68rem; margin-top: 4px; opacity: 0.75; text-align: right; }

    /* Поле введення */
    .input-area { padding: 14px 18px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; align-items: center; }
    #chat-input { flex: 1; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 24px; color: white; outline: none; font-size: 0.95rem; }
    #chat-input:focus { border-color: #38bdf8; }
    #send-btn { background: #0284c7; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- ЕКРАН 1: ГОЛОВНА (СПИСОК ЧАТІВ) -->
    <div id="chats-screen">
      <div class="app-header">
        <div class="app-title">NextTalk</div>
      </div>

      <div class="chat-list">
        <!-- Чат з Максимом -->
        <div class="chat-card" id="open-chat-btn">
          <div class="avatar">М</div>
          <div class="chat-info">
            <div class="chat-name">
              <span>Максим</span>
              <span class="chat-time" id="preview-time">08:53</span>
            </div>
            <div class="chat-preview" id="preview-msg">Натисніть, щоб відкрити чат...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ЕКРАН 2: ЛИСТУВАННЯ СУТО ВСЕРЕДИНІ ЧАТУ -->
    <div id="conversation-screen">
      <div class="chat-header">
        <button class="back-btn" id="back-btn">‹</button>
        <div class="avatar" style="width: 38px; height: 38px; font-size: 1rem;">М</div>
        <div>
          <div style="font-weight: 600; font-size: 0.95rem;">Максим</div>
          <div class="status">● В мережі</div>
        </div>
      </div>

      <div id="messages-area"></div>

      <div class="input-area">
        <input type="text" id="chat-input" placeholder="Напишіть повідомлення..." autocomplete="off">
        <button id="send-btn">➤</button>
      </div>
    </div>

  </div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBuGDd0y2y4Tkf-tcBU_ZshX2uUGK3uQWQ",
      authDomain: "my-website-5d781.firebaseapp.com",
      databaseURL: "https://my-website-5d781-default-rtdb.firebaseio.com",
      projectId: "my-website-5d781",
      storageBucket: "my-website-5d781.firebasestorage.app",
      messagingSenderId: "111570797151",
      appId: "1:111570797151:web:5d23161a445c946ccb51ea"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let userId = localStorage.getItem('chat_user_id');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('chat_user_id', userId);
    }

    const chatsScreen = document.getElementById('chats-screen');
    const conversationScreen = document.getElementById('conversation-screen');
    const openChatBtn = document.getElementById('open-chat-btn');
    const backBtn = document.getElementById('back-btn');

    const messagesArea = document.getElementById('messages-area');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const previewMsg = document.getElementById('preview-msg');
    const previewTime = document.getElementById('preview-time');

    // Перемикання екранів
    openChatBtn.onclick = () => conversationScreen.classList.add('active');
    backBtn.onclick = () => conversationScreen.classList.remove('active');

    // Зчитування повідомлень у реальному часі
    database.ref('chats/' + userId + '/messages').on('value', snapshot => {
      messagesArea.innerHTML = '';
      const data = snapshot.val();

      if (data) {
        const msgsArray = Object.values(data);
        const lastMsg = msgsArray[msgsArray.length - 1];

        // Оновлюємо прев'ю на головному екрані
        previewMsg.textContent = (lastMsg.sender === 'user' ? 'Ви: ' : '') + lastMsg.text;
        if (lastMsg.timestamp) previewTime.textContent = lastMsg.timestamp;

        // Малюємо всі повідомлення у чаті
        msgsArray.forEach(msg => {
          const isAdmin = msg.sender === 'admin';
          const div = document.createElement('div');
          div.className = 'msg ' + (isAdmin ? 'admin' : 'user');
          div.innerHTML = `
            ${isAdmin ? '<div class="msg-author">Максим</div>' : ''}
            <div>${msg.text}</div>
            <div class="msg-time">${msg.timestamp || ''}</div>
          `;
          messagesArea.appendChild(div);
        });
        messagesArea.scrollTop = messagesArea.scrollHeight;
      } else {
        previewMsg.textContent = 'Немає повідомлень';
      }
    });

    // Відправка повідомлення
    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      database.ref('chats/' + userId + '/messages').push({
        sender: 'user',
        text: text,
        timestamp: new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' })
      });

      database.ref('chats/' + userId + '/meta').set({
        lastUpdate: new Date().toLocaleString('uk-UA'),
        lastMessage: text
      });

      chatInput.value = '';
    }

    sendBtn.onclick = sendMessage;
    chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
  </script>
</body>
</html>
