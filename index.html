<body>
    <!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextTalk</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

    /* Контейнер чату (Картка месенджера) */
    .chat-container { width: 100%; max-width: 480px; height: 100vh; background: #1e293b; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    @media (min-width: 500px) {
      .chat-container { height: 90vh; border-radius: 16px; overflow: hidden; border: 1px solid #334155; }
    }

    /* Шапка чату */
    .chat-header { padding: 16px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: #0284c7; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 1.1rem; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 600; font-size: 1rem; color: #f8fafc; }
    .status { font-size: 0.75rem; color: #22c55e; display: flex; align-items: center; gap: 4px; }

    /* Область повідомлень */
    #messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0f172a; }
    
    /* Бульбашки повідомлень */
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 0.93rem; line-height: 1.4; word-wrap: break-word; position: relative; }
    
    /* Повідомлення користувача (ви) — сині справа */
    .msg.user { align-self: flex-end; background: #0284c7; color: #ffffff; border-bottom-right-radius: 2px; }
    
    /* Повідомлення співрозмовника (адміна) — темні зліва */
    .msg.admin { align-self: flex-start; background: #1e293b; color: #f8fafc; border-bottom-left-radius: 2px; border: 1px solid #334155; }
    
    .msg-author { font-size: 0.75rem; font-weight: 600; margin-bottom: 3px; color: #38bdf8; }
    .msg.user .msg-author { display: none; }
    .msg-time { font-size: 0.68rem; margin-top: 4px; opacity: 0.75; text-align: right; }

    /* Поле введення */
    .input-area { padding: 14px 18px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; align-items: center; }
    #chat-input { flex: 1; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 24px; color: white; outline: none; font-size: 0.95rem; transition: border 0.2s; }
    #chat-input:focus { border-color: #38bdf8; }
    #send-btn { background: #0284c7; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; font-size: 1.1rem; }
    #send-btn:hover { background: #0369a1; }

    /* Скролбар */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- Шапка з профілем -->
    <div class="chat-header">
      <div class="avatar">М</div>
      <div class="user-info">
        <div class="user-name">Максим</div>
        <div class="status"><span>●</span> В мережі</div>
      </div>
    </div>

    <!-- Історія чату -->
    <div id="messages-area">
      <div style="text-align: center; color: #64748b; font-size: 0.85rem; margin: auto;">
        Вітаємо в NextTalk! Напишіть своє повідомлення нижче.
      </div>
    </div>

    <!-- Форма відправки -->
    <div class="input-area">
      <input type="text" id="chat-input" placeholder="Напишіть повідомлення..." autocomplete="off">
      <button id="send-btn">➤</button>
    </div>
  </div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBuGDd0y2y4Tkf-tcBU_ZshX2uUGK3uQWQ",
      authDomain: "my-website-5d781.firebaseapp.com",
      databaseURL: "https://my-website-5d781-default-rtdb.firebaseio.com",
      projectId: "my-website-5d781",
      storageBucket: "my-website-5d781.firebasestorage.app",
      messagingSenderId: "111570797151",
      appId: "1:111570797151:web:5d23161a445c946ccb51ea"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Генеруємо унікальний ID відвідувача
    let userId = localStorage.getItem('chat_user_id');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('chat_user_id', userId);
    }

    const messagesArea = document.getElementById('messages-area');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');

    // 1. ЗЧИТАННЯ ПОВІДОМЛЕНЬ В РЕАЛЬНОМУ ЧАСІ
    database.ref('chats/' + userId + '/messages').on('value', snapshot => {
      messagesArea.innerHTML = '';
      const data = snapshot.val();

      if (data) {
        Object.values(data).forEach(msg => {
          const isAdmin = msg.sender === 'admin';
          const div = document.createElement('div');
          div.className = 'msg ' + (isAdmin ? 'admin' : 'user');
          
          div.innerHTML = `
            ${isAdmin ? '<div class="msg-author">Максим</div>' : ''}
            <div>${msg.text}</div>
            <div class="msg-time">${msg.timestamp || ''}</div>
          `;
          messagesArea.appendChild(div);
        });
        messagesArea.scrollTop = messagesArea.scrollHeight;
      } else {
        messagesArea.innerHTML = `
          <div style="text-align: center; color: #64748b; font-size: 0.85rem; margin: auto;">
            Залиште повідомлення, і Максим відповість вам найближчим часом!
          </div>
        `;
      }
    });

    // 2. ВІДПРАВКА ПОВІДОМЛЕННЯ
    function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;

  // ВАЖЛИВО: Записуємо в гілку 'chats/', а не в 'messages'
  database.ref('chats/' + userId + '/messages').push({
    sender: 'user',
    text: text,
    timestamp: new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' })
  });

  database.ref('chats/' + userId + '/meta').set({
    lastUpdate: new Date().toLocaleString('uk-UA'),
    lastMessage: text
  });

  chatInput.value = '';
}

    sendBtn.onclick = sendMessage;
    chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
  </script>
</body>
</body>
</html>
