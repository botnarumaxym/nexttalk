<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextTalk</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .chat-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative; }
    
    /* Шапка чату (клікабельна) */
    .chat-header { padding: 14px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.2s; }
    .chat-header:hover { background: #131d31; }
    
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: #0284c7; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; flex-shrink: 0; overflow: hidden; background-size: cover; background-position: center; }
    .header-info { display: flex; flex-direction: column; justify-content: center; flex: 1; }
    .chat-title { font-size: 1.05rem; font-weight: bold; color: #f8fafc; }
    .chat-subtitle { font-size: 0.8rem; color: #38bdf8; min-height: 1.1rem; }
    .edit-hint { font-size: 0.75rem; color: #64748b; }

    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0f172a; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #0284c7; color: #ffffff; border-bottom-right-radius: 2px; }
    .msg.admin { align-self: flex-start; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-bottom-left-radius: 2px; }
    .msg-time { font-size: 0.7rem; opacity: 0.75; text-align: right; margin-top: 4px; }
    
    .input-container { padding: 14px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; }
    #message-input { flex: 1; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 24px; color: white; outline: none; }
    #message-input:focus { border-color: #38bdf8; }
    #send-btn { background: #0284c7; color: white; border: none; padding: 0 20px; border-radius: 24px; font-weight: bold; cursor: pointer; }

    /* Модальне вікно редагування профілю */
    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .modal-title { font-size: 1.1rem; font-weight: bold; color: #f8fafc; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; color: #94a3b8; }
    .form-group input { padding: 10px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; outline: none; font-size: 0.9rem; }
    .form-group input:focus { border-color: #38bdf8; }
    .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
    .btn { padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 0.9rem; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-primary { background: #0284c7; color: white; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- Шапка чату -->
    <div class="chat-header" id="chat-header" title="Натисніть для редагування профілю">
      <div class="avatar" id="header-avatar">М</div>
      <div class="header-info">
        <div class="chat-title" id="header-name">Максим</div>
        <div class="chat-subtitle" id="typing-status">онлайн</div>
      </div>
      <div class="edit-hint">⚙️</div>
    </div>

    <!-- Повідомлення -->
    <div class="messages-container" id="messages-container"></div>

    <!-- Поле введення -->
    <div class="input-container">
      <input type="text" id="message-input" placeholder="Напишіть повідомлення..." autocomplete="off">
      <button id="send-btn">Надіслати</button>
    </div>

    <!-- Модальне вікно налаштувань профілю -->
    <div class="modal-overlay" id="profile-modal">
      <div class="modal-card">
        <div class="modal-title">Редагування профілю</div>
        
        <div class="form-group">
          <label for="edit-name">Ім'я співрозмовника:</label>
          <input type="text" id="edit-name" placeholder="Наприклад: Максим">
        </div>

        <div class="form-group">
          <label for="edit-status">Статус / Підпис:</label>
          <input type="text" id="edit-status" placeholder="Наприклад: онлайн">
        </div>

        <div class="form-group">
          <label for="edit-avatar-url">URL аватарки (або 1 літера):</label>
          <input type="text" id="edit-avatar-url" placeholder="Буква або посилання на фото">
        </div>

        <div class="modal-buttons">
          <button class="btn btn-secondary" id="close-modal-btn">Скасувати</button>
          <button class="btn btn-primary" id="save-profile-btn">Зберегти</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBuGDd0y2y4Tkf-tcBU_ZshX2uUGK3uQWQ",
      authDomain: "my-website-5d781.firebaseapp.com",
      databaseURL: "https://my-website-5d781-default-rtdb.firebaseio.com",
      projectId: "my-website-5d781",
      storageBucket: "my-website-5d781.firebasestorage.app",
      messagingSenderId: "111570797151",
      appId: "1:111570797151:web:5d23161a445c946ccb51ea"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let userId = localStorage.getItem('nexttalk_user_id');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('nexttalk_user_id', userId);
    }

    // Завантаження збереженого профілю
    let profileData = JSON.parse(localStorage.getItem('nexttalk_profile_data')) || {
      name: 'Максим',
      status: 'онлайн',
      avatar: 'М'
    };

    const headerName = document.getElementById('header-name');
    const headerAvatar = document.getElementById('header-avatar');
    const typingStatus = document.getElementById('typing-status');
    const chatHeader = document.getElementById('chat-header');
    
    const profileModal = document.getElementById('profile-modal');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const saveProfileBtn = document.getElementById('save-profile-btn');
    const editName = document.getElementById('edit-name');
    const editStatus = document.getElementById('edit-status');
    const editAvatarUrl = document.getElementById('edit-avatar-url');

    function updateProfileUI() {
  headerName.textContent = profileData.name;
  
  // 1. ПЕРЕВІРКА: Якщо текст починається з http:// або https:// або містить розширення (.jpg/.png)
  if (profileData.avatar.startsWith('http://') || 
      profileData.avatar.startsWith('https://') || 
      profileData.avatar.includes('.')) {
    
    // Встановлюємо фото як фонову картинку
    headerAvatar.style.backgroundImage = `url('${profileData.avatar}')`;
    
    // Очищаємо текст всередині кружечка (буква М зникає!)
    headerAvatar.textContent = ''; 
    
  } else {
    // 2. ІНАКШЕ (якщо це просто 1 літера або слово):
    headerAvatar.style.backgroundImage = 'none'; // прибираємо фото
    
    // Показуємо літеру по центру
    headerAvatar.textContent = (profileData.avatar || profileData.name.charAt(0)).toUpperCase();
  }
    }

    updateProfileUI();

    // Логіка модального вікна
    chatHeader.onclick = () => {
      editName.value = profileData.name;
      editStatus.value = profileData.status;
      editAvatarUrl.value = profileData.avatar;
      profileModal.classList.add('active');
    };

    closeModalBtn.onclick = () => profileModal.classList.remove('active');

    saveProfileBtn.onclick = () => {
  profileData.name = editName.value.trim() || 'Користувач';
  profileData.status = editStatus.value.trim() || 'онлайн';
  profileData.avatar = editAvatarUrl.value.trim() || profileData.name.charAt(0);

  // 1. Зберігаємо локально
  localStorage.setItem('nexttalk_profile_data', JSON.stringify(profileData));
  updateProfileUI();

  // 2. ВІДПРАВЛЯЄМО В FIREBASE ДЛЯ АДМІНКИ 🚀
  database.ref('chats/' + userId + '/profile').set({
    name: profileData.name,
    avatar: profileData.avatar
  });

  profileModal.classList.remove('active');
};

    // Чат і повідомлення
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    let typingTimeout = null;

    // Відслідковування вводу клієнта
    messageInput.addEventListener('input', () => {
      database.ref('chats/' + userId + '/userTyping').set(true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        database.ref('chats/' + userId + '/userTyping').set(false);
      }, 1500);
    });

    // Слухаємо статус від Адміна
    database.ref('chats/' + userId + '/adminTyping').on('value', snapshot => {
      if (snapshot.val() === true) {
        typingStatus.textContent = 'друкує...';
        typingStatus.style.color = '#38bdf8';
      } else {
        typingStatus.textContent = profileData.status || 'онлайн';
        typingStatus.style.color = '#94a3b8';
      }
    });

    // Слухаємо повідомлення
    database.ref('chats/' + userId + '/messages').on('value', snapshot => {
      messagesContainer.innerHTML = '';
      const data = snapshot.val();
      if (!data) return;

      Object.values(data).forEach(msg => {
        const div = document.createElement('div');
        const isMe = msg.sender === 'user';
        div.className = 'msg ' + (isMe ? 'user' : 'admin');
        div.innerHTML = `
          <div>${msg.text}</div>
          <div class="msg-time">${msg.timestamp || ''}</div>
        `;
        messagesContainer.appendChild(div);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });

    // Відправка повідомлення
    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      database.ref('chats/' + userId + '/userTyping').set(false);
      database.ref('chats/' + userId + '/messages').push({
        sender: 'user',
        text: text,
        timestamp: new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' })
      });

      messageInput.value = '';
    }

    sendBtn.onclick = sendMessage;
    messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
  </script>
</body>
</html>
