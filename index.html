<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NextTalk</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="app-icon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    :root { --primary: #0284c7; --primary-light: #38bdf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background-color: #0b1120; color: #f8fafc; overflow: hidden; position: fixed; }
    
    .screen { display: none; width: 100%; height: 100%; background: #0f172a; flex-direction: column; position: absolute; top: 0; left: 0; z-index: 10; overflow-y: auto; }
    .screen.active { display: flex; }
    
    .auth-container { padding: 2rem; display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 1rem; }
    .auth-container h2 { text-align: center; color: var(--primary-light); }
    .input-field { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:hover { filter: brightness(0.9); }
    .btn-secondary { background: transparent; color: #94a3b8; margin-top: 5px; }
    .error-msg { color: #f87171; font-size: 0.9rem; text-align: center; }
    
    .chat-header { padding: 15px; background: #0f172a; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; flex-shrink: 0; }
    .chat-title { font-weight: bold; font-size: 1.2rem; color: var(--primary-light); }
    .status-text { font-size: 0.8rem; color: #94a3b8; }
    .status-text.online { color: #22c55e; }
    .chat-header-user { text-align: center; cursor: pointer; padding: 4px 12px; border-radius: 8px; }
    .chat-header-user:hover { background-color: #1e293b; }
    
    .chat-item { background: #1e293b; padding: 15px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; margin-bottom: 10px; }
    .chat-item:hover { background: #334155; }
    
    .messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0f172a; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
    .msg.admin { align-self: flex-start; background: #1e293b; color: white; border-bottom-left-radius: 2px; border: 1px solid #334155; }
    .msg-meta { font-size: 0.7rem; opacity: 0.7; text-align: right; margin-top: 4px; }
    
    .chat-input-area { padding: 15px; background: #0f172a; display: flex; gap: 10px; border-top: 1px solid #1e293b; flex-shrink: 0; align-items: center; }
    .chat-input-area input { flex: 1; }
    .chat-input-area button { width: auto; padding: 0 16px; height: 44px; border-radius: 8px; }

    /* Кнопка запису голосового */
    .voice-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--primary-light);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }
    .voice-btn.recording {
      background: #ef4444 !important;
      color: white !important;
      animation: pulse-voice 1s infinite;
    }

    @keyframes pulse-voice {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    #settings-screen, #search-screen { padding: 20px; background: #0f172a; }
    .settings-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .settings-title { font-size: 1.4rem; font-weight: 700; }
    .action-btn { background: none; border: none; color: var(--primary-light); font-size: 1rem; font-weight: 600; cursor: pointer; }
    
    .profile-card { display: flex; align-items: center; background-color: #1e293b; padding: 14px 16px; border-radius: 14px; margin-bottom: 22px; cursor: pointer; border: 1px solid #334155; }
    .profile-avatar-small { width: 52px; height: 52px; border-radius: 50%; margin-right: 14px; background-color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: bold; overflow: hidden; }
    .profile-avatar-small img { width: 100%; height: 100%; object-fit: cover; }
    
    .settings-item { display: flex; align-items: center; padding: 12px 14px; border-radius: 12px; cursor: pointer; color: #f8fafc; margin-bottom: 5px; }
    .settings-item:hover { background-color: #1e293b; }
    
    #profile-screen, #appearance-screen { padding: 20px; background: #0f172a; }
    .screen-header { display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 24px; }
    .screen-header .back-btn { position: absolute; left: 0; background: none; border: none; color: #ffffff; font-size: 1.2rem; cursor: pointer; }
    
    .profile-avatar-large { width: 90px; height: 90px; border-radius: 50%; background-color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; overflow: hidden; margin-bottom: 12px; }
    .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; }
    .field-row { display: flex; align-items: center; gap: 16px; padding: 8px 0; cursor: pointer; }
    
    .color-swatches { display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
    .color-swatch { width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 2px solid #334155; }

    #call-screen { background: linear-gradient(135deg, #0b1120 0%, #1e293b 100%); }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 var(--primary-light); }
      70% { box-shadow: 0 0 0 25px rgba(0, 0, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0); }
    }
    .avatar-calling {
      width: 120px !important; 
      height: 120px !important; 
      font-size: 3.5rem !important;
      margin: 0 auto 30px auto !important;
      border: 3px solid var(--primary-light);
      animation: pulse-ring 2s infinite;
    }
    
    .call-btn { width: 70px; height: 70px; border-radius: 50%; font-size: 2rem; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
    .call-btn:active { transform: scale(0.9); }
    .call-btn.accept { background: #22c55e; color: white; box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4); }
    .call-btn.decline { background: #ef4444; color: white; box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4); transform: rotate(135deg); }

    /* Стилі для стильного аудіоплеєра у чаті */
    audio::-webkit-media-controls-panel { background-color: #1e293b; }
    .msg audio { max-width: 220px; height: 35px; border-radius: 8px; margin-top: 4px; outline: none; }
  </style>
</head>
<body>

  <!-- Авторизація -->
  <div id="auth-screen" class="screen active">
    <div class="auth-container">
      <h2 id="auth-desc">Увійдіть у свій акаунт</h2>
      <input type="text" id="auth-name" class="input-field" placeholder="Ваше ім'я" style="display: none;">
      <input type="email" id="auth-email" class="input-field" placeholder="Email">
      <input type="password" id="auth-password" class="input-field" placeholder="Пароль">
      <div id="auth-error" class="error-msg"></div>
      <button id="auth-submit-btn" class="btn">Увійти</button>
      <button id="auth-toggle-btn" class="btn btn-secondary">Немає акаунту? Зареєструватися</button>
    </div>
  </div>

  <!-- Список чатів -->
  <div id="chats-screen" class="screen">
    <div class="chat-header">
      <span class="chat-title">NextTalk</span>
      <div>
        <button id="open-search-btn" style="background:none; border:none; color:white; cursor:pointer; font-size:1.2rem; margin-right: 15px;">🔍</button>
        <button id="open-settings-btn" style="background:none; border:none; color:white; cursor:pointer; font-size:1.3rem;">⚙️</button>
        <button id="logout-btn" style="background:none; border:none; color:#f87171; cursor:pointer; margin-left:10px;">Вийти</button>
      </div>
    </div>
    <div style="padding: 15px;" id="chats-list-container"></div>
  </div>

  <!-- Пошук -->
  <div id="search-screen" class="screen">
    <div class="settings-header">
      <div class="settings-title">Пошук друга</div>
      <button onclick="hideSearchScreen()" class="action-btn">Назад</button>
    </div>
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <input type="text" id="search-username-input" class="input-field" placeholder="Введіть Email друга">
      <button onclick="searchUser()" class="btn" style="width: auto; padding: 0 20px;">Знайти</button>
    </div>
    <div id="search-result-container"></div>
  </div>

  <!-- Вікно чату -->
  <div id="chat-screen" class="screen">
    <div class="chat-header">
      <button id="back-btn" style="background:none; border:none; color:white; cursor:pointer; font-size:1.1rem;">← Назад</button>
      <div id="chat-header-user" class="chat-header-user" onclick="showProfileFromChat()">
        <div id="active-chat-name" style="font-weight: bold;">Користувач</div>
        <div id="typing-status" class="status-text">завантаження...</div>
      </div>
      <div style="display: flex; align-items: center; width: 30px;">
        <button id="start-call-btn" style="background:none; border:none; color:var(--primary-light); cursor:pointer; font-size:1.3rem; display:none;" title="Зателефонувати">📞</button>
      </div>
    </div>
    <div id="messages-container" class="messages-box"></div>
    <div class="chat-input-area">
      <!-- Кнопка запису голосового -->
      <button id="voice-record-btn" class="voice-btn" title="Утримуйте або натисніть для запису">🎙️</button>
      <input type="text" id="message-input" class="input-field" placeholder="Напишіть повідомлення...">
      <button id="send-btn" class="btn">➤</button>
    </div>
  </div>

  <!-- Екран виклику (дзвінка) -->
  <div id="call-screen" class="screen" style="z-index: 100; justify-content: center; align-items: center;">
    <div style="text-align: center;">
      <div id="call-avatar" class="profile-avatar-large avatar-calling">📞</div>
      <h2 id="call-name" style="color: white; margin-bottom: 10px; font-size: 1.8rem; font-weight: 600;">Дзвінок...</h2>
      <div id="call-status" style="font-size: 1.1rem; margin-bottom: 50px; color: var(--primary-light);">З'єднання...</div>
      
      <div style="display: flex; gap: 40px; justify-content: center;">
        <button id="answer-btn" class="call-btn accept" style="display: none;">📞</button>
        <button id="hangup-btn" class="call-btn decline">📞</button>
      </div>
    </div>
  </div>

  <!-- Аудіо елементи для дзвінка -->
  <audio id="local-audio" autoplay muted></audio>
  <audio id="remote-audio" autoplay></audio>

  <!-- Налаштування -->
  <div id="settings-screen" class="screen">
    <div class="settings-header">
      <div class="settings-title">Налаштування</div>
      <button id="close-settings-btn" class="action-btn">Готово</button>
    </div>
    <div class="profile-card" onclick="showProfileScreen()">
      <div id="user-avatar-small" class="profile-avatar-small">К</div>
      <div style="color:white; font-weight:bold; font-size: 1.1rem;" id="user-display-name-settings">Користувач</div>
    </div>
    <div class="settings-item" onclick="showAppearanceScreen()">
      <span>🎨 Вигляд (Тема)</span>
    </div>
  </div>

  <div id="appearance-screen" class="screen">
    <div class="screen-header">
      <button class="back-btn" onclick="hideAppearanceScreen()">←</button>
      <div class="screen-title">Вигляд</div>
    </div>
    <div class="color-swatches">
      <div class="color-swatch" style="background: #0284c7;" onclick="setTheme('#0284c7', '#38bdf8')"></div>
      <div class="color-swatch" style="background: #16a34a;" onclick="setTheme('#16a34a', '#4ade80')"></div>
      <div class="color-swatch" style="background: #9333ea;" onclick="setTheme('#9333ea', '#c084fc')"></div>
      <div class="color-swatch" style="background: #db2777;" onclick="setTheme('#db2777', '#f472b6')"></div>
      <div class="color-swatch" style="background: #ea580c;" onclick="setTheme('#ea580c', '#fb923c')"></div>
      <div class="color-swatch" style="background: #dc2626;" onclick="setTheme('#dc2626', '#f87171')"></div>
    </div>
  </div>

  <div id="profile-screen" class="screen">
    <div class="screen-header">
      <button class="back-btn" onclick="hideProfileScreen()">←</button>
      <div class="screen-title">Профіль</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;">
      <div id="user-avatar-large" class="profile-avatar-large">К</div>
      <button onclick="changeAvatarUrl()" style="background: #1e293b; color: var(--primary-light); border: 1px solid #334155; padding: 8px 16px; border-radius: 18px; cursor: pointer;">Змінити фото</button>
    </div>
    <div class="field-row" onclick="editName()"><span style="color:var(--primary-light); width:30px;">👤</span> <span id="profile-name-val" style="color:white;">Користувач</span></div>
    <div class="field-row" onclick="editAbout()"><span style="color:var(--primary-light); width:30px;">ℹ️</span> <span id="profile-about-val" style="color:white;">Привіт! Я використовую NextTalk.</span></div>
  </div>

  <!-- Firebase СКРИПТИ -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>

  <script>
    function setTheme(primary, light) {
      document.documentElement.style.setProperty('--primary', primary);
      document.documentElement.style.setProperty('--primary-light', light);
      localStorage.setItem('themePrimary', primary);
      localStorage.setItem('themeLight', light);
    }
    const savedPrimary = localStorage.getItem('themePrimary');
    const savedLight = localStorage.getItem('themeLight');
    if (savedPrimary && savedLight) setTheme(savedPrimary, savedLight);

    const firebaseConfig = {
      apiKey: "AIzaSyBuGDd0y2y4Tkf-tcBU_ZshX2uUGK3uQWQ",
      authDomain: "my-website-5d781.firebaseapp.com",
      databaseURL: "https://my-website-5d781-default-rtdb.firebaseio.com",
      projectId: "my-website-5d781",
      storageBucket: "my-website-5d781.firebasestorage.app",
      messagingSenderId: "111570797151",
      appId: "1:111570797151:web:5d23161a445c946ccb51ea"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();
    const messaging = firebase.messaging();

    let currentUser = null;
    let currentChatUserId = null;
    let currentListener = null;
    let previousScreen = 'chats-screen';

    function formatExactLastSeen(timestamp) {
      if (!timestamp) return 'офлайн';
      const date = new Date(timestamp);
      const now = new Date();
      const isToday = date.getDate() === now.getDate() && date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear();
      const yesterday = new Date(now);
      yesterday.setDate(yesterday.getDate() - 1);
      const isYesterday = date.getDate() === yesterday.getDate() && date.getMonth() === yesterday.getMonth() && date.getFullYear() === yesterday.getFullYear();
      const timeString = date.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
      if (isToday) return 'був(ла) сьогодні о ' + timeString;
      else if (isYesterday) return 'був(ла) вчора о ' + timeString;
      else return 'був(ла) ' + date.toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' о ' + timeString;
    }

    function escapeHTML(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

    function requestNotificationPermission() {
      messaging.requestPermission().then(() => messaging.getToken()).then((token) => {
        if (token && currentUser) database.ref('chats/' + currentUser.uid + '/fcmToken').set(token);
      }).catch(err => console.log('Помилка сповіщень:', err));
    }

    const screens = ['auth-screen', 'chats-screen', 'search-screen', 'chat-screen', 'settings-screen', 'profile-screen', 'appearance-screen'];
    function switchScreen(screenId) {
      screens.forEach(s => document.getElementById(s).classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    document.getElementById('back-btn').onclick = () => { switchScreen('chats-screen'); document.getElementById('start-call-btn').style.display = 'none'; currentChatUserId = null; };
    document.getElementById('open-settings-btn').onclick = () => switchScreen('settings-screen');
    document.getElementById('close-settings-btn').onclick = () => switchScreen('chats-screen');
    document.getElementById('open-search-btn').onclick = () => switchScreen('search-screen');
    function hideSearchScreen() { switchScreen('chats-screen'); }
    function showAppearanceScreen() { switchScreen('appearance-screen'); }
    function hideAppearanceScreen() { switchScreen('settings-screen'); }
    function hideProfileScreen() { switchScreen(previousScreen); }

    function showProfileScreen() { previousScreen = 'settings-screen'; switchScreen('profile-screen'); loadProfileData(currentUser.uid, true); }
    function showProfileFromChat() { previousScreen = 'chat-screen'; switchScreen('profile-screen'); loadProfileData(currentChatUserId, false); }

    function loadProfileData(targetUid, isEditable) {
      database.ref('chats/' + targetUid + '/profile').once('value').then(snap => {
        const p = snap.val() || {};
        document.getElementById('profile-name-val').textContent = p.name || "Користувач";
        document.getElementById('profile-about-val').textContent = p.about || "Привіт! Я використовую NextTalk.";
        const ava = document.getElementById('user-avatar-large');
        if (p.avatarUrl) ava.innerHTML = `<img src="${p.avatarUrl}">`; else ava.innerHTML = (p.name || 'К').charAt(0).toUpperCase();
      });
    }

    function editName() { const n = prompt("Нове ім'я:"); if (n) database.ref('chats/' + currentUser.uid + '/profile').update({ name: n }); }
    function editAbout() { const a = prompt("Новий статус:"); if (a !== null) database.ref('chats/' + currentUser.uid + '/profile').update({ about: a }); }
    function changeAvatarUrl() { const u = prompt("URL фото:"); if (u !== null) database.ref('chats/' + currentUser.uid + '/profile').update({ avatarUrl: u }); }

    let isSignUpMode = false;
    document.getElementById('auth-toggle-btn').onclick = () => {
      isSignUpMode = !isSignUpMode;
      document.getElementById('auth-name').style.display = isSignUpMode ? 'block' : 'none';
      document.getElementById('auth-submit-btn').textContent = isSignUpMode ? 'Зареєструватися' : 'Увійти';
      document.getElementById('auth-toggle-btn').textContent = isSignUpMode ? 'Вже є акаунт? Увійти' : 'Немає акаунту? Зареєструватися';
    };

    document.getElementById('auth-submit-btn').onclick = () => {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      const name = document.getElementById('auth-name').value.trim();
      if (!email || !pass) return alert('Заповніть всі поля');
      if (isSignUpMode) {
        if (!name) return alert('Введіть ім\'я');
        auth.createUserWithEmailAndPassword(email, pass).then(cred => {
          database.ref('chats/' + cred.user.uid + '/profile').set({ name: name, email: email, about: 'Привіт! Я використовую NextTalk.' });
        }).catch(e => alert(e.message));
      } else {
        auth.signInWithEmailAndPassword(email, pass).catch(e => alert('Невірний логін або пароль'));
      }
    };
    document.getElementById('logout-btn').onclick = () => auth.signOut();

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        switchScreen('chats-screen');
        database.ref('chats/' + user.uid + '/profile/email').set(user.email);
        
        const statusRef = database.ref('chats/' + user.uid + '/status');
        database.ref('.info/connected').on('value', snap => {
          if (snap.val() === true) {
            statusRef.onDisconnect().set({ online: false, lastSeen: firebase.database.ServerValue.TIMESTAMP });
            statusRef.set({ online: true, lastSeen: firebase.database.ServerValue.TIMESTAMP });
          }
        });
        
        database.ref('chats/' + user.uid + '/profile').on('value', snap => {
          const p = snap.val() || {};
          document.getElementById('user-display-name-settings').textContent = p.name || 'Користувач';
          const smallAva = document.getElementById('user-avatar-small');
          smallAva.innerHTML = p.avatarUrl ? `<img src="${p.avatarUrl}">` : (p.name || 'К').charAt(0).toUpperCase();
        });
        
        loadUserChats(user.uid);
        requestNotificationPermission();
        listenForCalls();
      } else {
        currentUser = null;
        switchScreen('auth-screen');
      }
    });

    function searchUser() {
      const q = document.getElementById('search-username-input').value.trim().toLowerCase();
      if (!q) return;
      database.ref('chats').once('value').then(snap => {
        let found = null;
        snap.forEach(child => {
          const u = child.val();
          if (u.profile && u.profile.email && u.profile.email.toLowerCase() === q && child.key !== currentUser.uid) {
            found = { uid: child.key, ...u.profile };
          }
        });
        const c = document.getElementById('search-result-container');
        if (found) {
          c.innerHTML = `<div class="chat-item" onclick="openDirectChat('${found.uid}', '${escapeHTML(found.name)}')"><div><b>${escapeHTML(found.name)}</b><br><small>${escapeHTML(found.email)}</small></div></div>`;
        } else {
          c.innerHTML = '<div style="color:red; margin-top:10px;">Не знайдено</div>';
        }
      });
    }

    function getChatId(u1, u2) { return u1 < u2 ? u1 + '_' + u2 : u2 + '_' + u1; }

    function openDirectChat(friendUid, friendName) {
      currentChatUserId = friendUid;
      switchScreen('chat-screen');
      document.getElementById('active-chat-name').textContent = friendName;
      document.getElementById('start-call-btn').style.display = 'block';
      
      const typingStatus = document.getElementById('typing-status');
      database.ref('chats/' + friendUid + '/status').on('value', snap => {
        const st = snap.val();
        if (st && st.online) {
          typingStatus.textContent = 'онлайн';
          typingStatus.className = 'status-text online';
        } else if (st && st.lastSeen) {
          typingStatus.textContent = formatExactLastSeen(st.lastSeen);
          typingStatus.className = 'status-text';
        } else {
          typingStatus.textContent = 'офлайн';
          typingStatus.className = 'status-text';
        }
      });
      
      const chatId = getChatId(currentUser.uid, friendUid);
      if (currentListener) database.ref(currentListener).off();
      currentListener = 'direct_messages/' + chatId;

      const msgsContainer = document.getElementById('messages-container');
      database.ref(currentListener).on('value', snap => {
        msgsContainer.innerHTML = '';
        const data = snap.val();
        if (data) Object.values(data).forEach(m => {
          const isMe = m.sender === currentUser.uid;
          const msgDiv = document.createElement('div');
          msgDiv.className = `msg ${isMe ? 'user' : 'admin'}`;
          
          // Рендеринг голосового або звичайного повідомлення
          if (m.audioUrl) {
            msgDiv.innerHTML = `<div>🎤 Голосове повідомлення</div><audio src="${m.audioUrl}" controls></audio><div class="msg-meta">${m.timestamp||''}</div>`;
          } else {
            let textStyle = m.text && m.text.includes('📞') ? 'font-weight: bold;' : '';
            msgDiv.innerHTML = `<span style="${textStyle}">${escapeHTML(m.text || '')}</span><div class="msg-meta">${m.timestamp||''}</div>`;
          }
          
          msgsContainer.appendChild(msgDiv);
        });
        msgsContainer.scrollTop = msgsContainer.scrollHeight;
      });
    }

    document.getElementById('send-btn').onclick = sendMessage;
    document.getElementById('message-input').onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentChatUserId) return;
      database.ref('direct_messages/' + getChatId(currentUser.uid, currentChatUserId)).push({
        sender: currentUser.uid, text: text, timestamp: new Date().toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'})
      });
      input.value = '';
    }

    function loadUserChats(uid) {
      database.ref('direct_messages').on('value', snap => {
        const c = document.getElementById('chats-list-container');
        c.innerHTML = '';
        const all = snap.val();
        if (!all) return c.innerHTML = '<div style="color:gray;">Немає діалогів</div>';
        Object.entries(all).forEach(([cid, msgs]) => {
          if (cid.includes(uid)) {
            const fUid = cid.replace(uid, '').replace('_', '');
            database.ref('chats/' + fUid + '/profile').once('value').then(s => {
              const p = s.val() || {name:'Користувач'};
              const mArr = Object.values(msgs);
              const lastMsgObj = mArr[mArr.length - 1];
              let lastM = lastMsgObj ? (lastMsgObj.audioUrl ? '🎤 Голосове повідомлення' : lastMsgObj.text) : '';
              
              const div = document.createElement('div');
              div.className = 'chat-item';
              div.innerHTML = `<div><b>${escapeHTML(p.name)}</b><br><small style="color:gray;">${escapeHTML(lastM)}</small></div>`;
              div.onclick = () => openDirectChat(fUid, p.name);
              c.appendChild(div);
            });
          }
        });
      });
    }

    // ==========================================
    // ЛОГІКА ГОЛОСОВИХ ПОВІДОМЛЕНЬ (MediaRecorder)
    // ==========================================
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    const voiceRecordBtn = document.getElementById('voice-record-btn');

    async function toggleVoiceRecord() {
      if (!currentChatUserId) return;

      if (!isRecording) {
        // Починаємо запис
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              const base64Audio = reader.result;
              // Відправляємо голосове в базу даних
              database.ref('direct_messages/' + getChatId(currentUser.uid, currentChatUserId)).push({
                sender: currentUser.uid,
                audioUrl: base64Audio,
                timestamp: new Date().toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'})
              });
            };
            // Вимикаємо мікрофон після запису
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          isRecording = true;
          voiceRecordBtn.classList.add('recording');
          voiceRecordBtn.textContent = '⏹️';
        } catch (err) {
          alert('Помилка доступу до мікрофона для запису!');
        }
      } else {
        // Зупиняємо запис і відправляємо
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        isRecording = false;
        voiceRecordBtn.classList.remove('recording');
        voiceRecordBtn.textContent = '🎙️';
      }
    }

    voiceRecordBtn.onclick = toggleVoiceRecord;

    // ==========================================
    // ЛОГІКА ДЗВІНКІВ (WebRTC + Firebase)
    // ==========================================
    const rtcConfig = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };
    let peerConnection = null;
    let localStream = null;
    let callActive = false;
    let currentCallNode = null; 

    const callScreen = document.getElementById('call-screen');
    const callName = document.getElementById('call-name');
    const callStatus = document.getElementById('call-status');
    const answerBtn = document.getElementById('answer-btn');
    const callAvatar = document.getElementById('call-avatar');
    
    async function initMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        document.getElementById('local-audio').srcObject = localStream;
      } catch (err) {
        alert("Не вдалося отримати доступ до мікрофона!");
        throw err;
      }
    }

    function createPeerConnection(friendUid, isCaller) {
      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      peerConnection.ontrack = event => { document.getElementById('remote-audio').srcObject = event.streams[0]; };

      peerConnection.onicecandidate = event => {
        if (event.candidate) {
          const type = isCaller ? 'callerCandidates' : 'receiverCandidates';
          database.ref(`calls/${currentCallNode}/${type}`).push(event.candidate.toJSON());
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (peerConnection.connectionState === 'connected') {
          callStatus.textContent = "Розмова 🎙️";
          callStatus.style.color = "#4ade80";
          callAvatar.classList.remove('avatar-calling');
        } else if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
          endCallUI();
        }
      };
    }

    document.getElementById('start-call-btn').onclick = async () => {
      if (!currentChatUserId) return;
      currentCallNode = currentChatUserId; 
      
      callScreen.classList.add('active');
      callAvatar.classList.add('avatar-calling');
      callStatus.style.color = "var(--primary-light)";
      
      database.ref('chats/' + currentChatUserId + '/profile').once('value').then(snap => {
        const p = snap.val() || {};
        callName.textContent = p.name || "Користувач";
        if (p.avatarUrl) callAvatar.innerHTML = `<img src="${p.avatarUrl}">`; 
        else callAvatar.innerHTML = (p.name || 'К').charAt(0).toUpperCase();
      });

      callStatus.textContent = "Дзвонимо...";
      answerBtn.style.display = 'none'; 
      callActive = true;

      await initMedia();
      createPeerConnection(currentChatUserId, true);

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      const callRef = database.ref(`calls/${currentCallNode}`);
      callRef.set({
        callerId: currentUser.uid,
        callerName: document.getElementById('user-display-name-settings').textContent,
        offer: { type: offer.type, sdp: offer.sdp }
      });

      callRef.on('value', async snapshot => {
        const data = snapshot.val();
        if (!data) return endCallUI(); 
        if (data.answer && !peerConnection.currentRemoteDescription) {
          const rtcAnswer = new RTCSessionDescription(data.answer);
          await peerConnection.setRemoteDescription(rtcAnswer);
        }
      });

      database.ref(`calls/${currentCallNode}/receiverCandidates`).on('child_added', snapshot => {
        const candidate = new RTCIceCandidate(snapshot.val());
        peerConnection.addIceCandidate(candidate);
      });
    };

    function listenForCalls() {
      database.ref(`calls/${currentUser.uid}`).on('value', snapshot => {
        const data = snapshot.val();
        
        if (data && data.offer && !callActive) {
          currentCallNode = currentUser.uid;
          currentChatUserId = data.callerId;
          callActive = true;
          
          callScreen.classList.add('active');
          callAvatar.classList.add('avatar-calling');
          callStatus.style.color = "var(--primary-light)";
          callName.textContent = data.callerName || "Вхідний виклик";
          callStatus.textContent = "Вам дзвонять...";
          answerBtn.style.display = 'flex'; 
          
          database.ref('chats/' + data.callerId + '/profile/avatarUrl').once('value').then(snap => {
             if (snap.val()) callAvatar.innerHTML = `<img src="${snap.val()}">`;
             else callAvatar.innerHTML = (data.callerName || '📞').charAt(0).toUpperCase();
          });
        }
        
        if (!data && callActive) {
          endCallUI();
        }
      });
    }

    answerBtn.onclick = async () => {
      answerBtn.style.display = 'none';
      callStatus.textContent = "З'єднання...";
      
      const callRef = database.ref(`calls/${currentCallNode}`);
      const snapshot = await callRef.once('value');
      const data = snapshot.val();
      
      if (!data || !data.offer) return endCallUI();

      await initMedia();
      createPeerConnection(data.callerId, false);

      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      callRef.update({ answer: { type: answer.type, sdp: answer.sdp } });

      database.ref(`calls/${currentCallNode}/callerCandidates`).on('child_added', snap => {
        peerConnection.addIceCandidate(new RTCIceCandidate(snap.val()));
      });
    };

    document.getElementById('hangup-btn').onclick = () => {
      let msgText = "📞 Дзвінок завершено";
      if (callStatus.textContent === "Дзвонимо..." || callStatus.textContent === "Вам дзвонять...") {
        msgText = "📞 Скасований виклик";
      }
      
      if (currentChatUserId && currentUser) {
        database.ref('direct_messages/' + getChatId(currentUser.uid, currentChatUserId)).push({
          sender: currentUser.uid, 
          text: msgText, 
          timestamp: new Date().toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'})
        });
      }

      if (currentCallNode) database.ref(`calls/${currentCallNode}`).remove(); 
      endCallUI();
    };

    function endCallUI() {
      callActive = false;
      callScreen.classList.remove('active');
      answerBtn.style.display = 'none';
      callAvatar.classList.remove('avatar-calling');
      
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
      if (currentCallNode) {
        database.ref(`calls/${currentCallNode}`).off(); 
        database.ref(`calls/${currentCallNode}/callerCandidates`).off();
        database.ref(`calls/${currentCallNode}/receiverCandidates`).off();
        currentCallNode = null;
      }
    }
  </script>
</body>
</html>
