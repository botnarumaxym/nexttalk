<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextTalk</title>
  
  <!-- Мета-теги PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#121212">
  <link rel="icon" type="image/png" href="app-icon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Екрани */
    .screen {
      display: none;
      width: 100%;
      max-width: 450px;
      height: 100vh;
      background: #1e293b;
      flex-direction: column;
      position: relative;
    }
    .screen.active {
      display: flex;
    }

    /* 1. Авторизація */
    .auth-container {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      gap: 1rem;
    }
    .auth-container h2 { text-align: center; color: #38bdf8; }
    .input-field {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      outline: none;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #0284c7;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .btn-secondary { background: transparent; color: #94a3b8; margin-top: 5px; }
    .error-msg { color: #f87171; font-size: 0.9rem; text-align: center; }

    /* Шапка */
    .chat-header {
      padding: 15px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
    }
    .chat-title { font-weight: bold; font-size: 1.2rem; color: #38bdf8; }
    .status-text { font-size: 0.8rem; color: #94a3b8; }
    .typing { color: #38bdf8; font-style: italic; }

    /* Список чатів */
    .chat-item {
      background: #334155;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }
    .chat-item:hover { background: #475569; }

    /* Вікно повідомлень */
    .messages-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: #0284c7; color: white; border-bottom-right-radius: 2px; }
    .msg.admin { align-self: flex-start; background: #334155; color: white; border-bottom-left-radius: 2px; }
    .msg-meta { font-size: 0.7rem; opacity: 0.7; text-align: right; margin-top: 4px; display: flex; justify-content: flex-end; gap: 4px; }

    /* Поле вводу */
    .chat-input-area { padding: 15px; background: #0f172a; display: flex; gap: 10px; border-top: 1px solid #334155; }
    .chat-input-area input { flex: 1; }
    .chat-input-area button { width: auto; padding: 0 20px; }

    /* -------------------------------------------------------------
       2. Екран налаштувань (Signal Style)
    ------------------------------------------------------------- */
    #settings-screen {
      background-color: #121212;
      padding: 20px;
      overflow-y: auto;
    }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .settings-title { font-size: 1.5rem; font-weight: 700; }
    .close-btn { background: none; border: none; color: #0a84ff; font-size: 1rem; font-weight: 600; cursor: pointer; }

    .profile-card {
      display: flex;
      align-items: center;
      background-color: #1c1c1e;
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 22px;
      cursor: pointer;
    }
    .profile-card:hover { background-color: #2c2c2e; }

    .profile-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      margin-right: 14px;
      background-color: #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      color: #ffffff;
      flex-shrink: 0;
      overflow: hidden;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .profile-info { display: flex; flex-direction: column; overflow: hidden; }
    .profile-name { font-weight: 600; font-size: 1.1rem; color: #ffffff; }
    .profile-phone { font-size: 0.88rem; color: #8e8e93; margin-top: 2px; }

    .settings-list { display: flex; flex-direction: column; gap: 2px; }
    .settings-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      color: #f2f2f7;
      font-size: 1rem;
    }
    .settings-item:hover { background-color: #1c1c1e; }
    .settings-icon { width: 22px; height: 22px; margin-right: 16px; color: #8e8e93; flex-shrink: 0; }

    /* Модальне вікно */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #1c1c1e;
      padding: 24px;
      border-radius: 18px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
  </style>
</head>
<body>

  <!-- 1. Екран авторизації -->
  <div id="auth-screen" class="screen active">
    <div class="auth-container">
      <h2 id="auth-desc">Увійдіть у свій акаунт</h2>
      <input type="text" id="auth-name" class="input-field" placeholder="Ваше ім'я" style="display: none;">
      <input type="email" id="auth-email" class="input-field" placeholder="Email">
      <input type="password" id="auth-password" class="input-field" placeholder="Пароль">
      <div id="auth-error" class="error-msg"></div>
      <button id="auth-submit-btn" class="btn">Увійти</button>
      <button id="auth-toggle-btn" class="btn btn-secondary">Немає акаунту? Зареєструватися</button>
    </div>
  </div>

  <!-- 2. Список чатів -->
  <div id="chats-screen" class="screen">
    <div class="chat-header">
      <span class="chat-title">NextTalk</span>
      <div>
        <button id="open-settings-btn" style="background:none; border:none; color:white; cursor:pointer; font-size:1.3rem;">⚙️</button>
        <button id="logout-btn" style="background:none; border:none; color:#f87171; cursor:pointer; margin-left:10px;">Вийти</button>
      </div>
    </div>
    <div style="padding: 15px;">
      <div id="open-chat-btn" class="chat-item">
        <div>
          <div style="font-weight: bold;">Максим</div>
          <div id="list-preview" style="font-size: 0.85rem; color: #94a3b8; margin-top: 3px;">Немає повідомлень</div>
        </div>
        <div id="list-time" style="font-size: 0.75rem; color: #64748b;"></div>
      </div>
    </div>
  </div>

  <!-- 3. Екран діалогу -->
  <div id="chat-screen" class="screen">
    <div class="chat-header">
      <button id="back-btn" style="background:none; border:none; color:white; cursor:pointer; font-size:1.1rem;">← Назад</button>
      <div style="text-align: center;">
        <div style="font-weight: bold;">Максим</div>
        <div id="typing-status" class="status-text">офлайн</div>
      </div>
      <div style="width: 30px;"></div>
    </div>

    <div id="messages-container" class="messages-box"></div>

    <div class="chat-input-area">
      <input type="text" id="message-input" class="input-field" placeholder="Напишіть повідомлення...">
      <button id="send-btn" class="btn">➤</button>
    </div>
  </div>

  <!-- 4. Екран налаштувань Signal Style -->
  <div id="settings-screen" class="screen">
    <div class="settings-header">
      <div class="settings-title">Налаштування</div>
      <button id="close-settings-btn" class="close-btn">Готово</button>
    </div>

    <div class="profile-card" onclick="openProfileModal()">
      <div id="user-avatar" class="profile-avatar">М</div>
      <div class="profile-info">
        <span id="user-display-name" class="profile-name">Максим Ботнару</span>
        <span id="user-display-phone" class="profile-phone">068 224 1029</span>
      </div>
    </div>

    <div class="settings-list">
      <div class="settings-item" onclick="openSection('Загальні')">
        <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Загальні</span>
      </div>
      <div class="settings-item" onclick="openSection('Вигляд')">
        <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"></path></svg>
        <span>Вигляд</span>
      </div>
      <div class="settings-item" onclick="openSection('Чати')">
        <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>Чати</span>
      </div>
      <div class="settings-item" onclick="openSection('Виклики')">
        <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        <span>Виклики</span>
      </div>
      <div class="settings-item" onclick="openSection('Сповіщення')">
        <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span>Сповіщення</span>
      </div>
      <div class="settings-item" onclick="openSection('Конфіденційність')">
        <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>Конфіденційність</span>
      </div>
      <div class="settings-item" onclick="openSection('Використання даних')">
        <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 1 10 10h-10V2z"></path></svg>
        <span>Використання даних</span>
      </div>
      <div class="settings-item" onclick="openSection('Резервні копії')">
        <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>Резервні копії</span>
      </div>
      <div class="settings-item" onclick="openSection('Підтримати NextTalk')">
        <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        <span>Підтримати NextTalk</span>
      </div>
    </div>
  </div>

  <!-- Модальне вікно редагування -->
  <div id="profile-modal" class="modal">
    <div class="modal-content">
      <h3>Редагувати профіль</h3>
      <input type="text" id="edit-name" class="input-field" placeholder="Ім'я та Прізвище">
      <input type="text" id="edit-phone" class="input-field" placeholder="Номер телефону">
      <input type="text" id="edit-avatar-url" class="input-field" placeholder="URL аватара (необов'язково)">
      <button class="btn" onclick="saveProfile()">Зберегти</button>
      <button class="btn btn-secondary" onclick="closeProfileModal()">Скасувати</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBuGDd0y2y4Tkf-tcBU_ZshX2uUGK3uQWQ",
      authDomain: "my-website-5d781.firebaseapp.com",
      databaseURL: "https://my-website-5d781-default-rtdb.firebaseio.com",
      projectId: "my-website-5d781",
      storageBucket: "my-website-5d781.firebasestorage.app",
      messagingSenderId: "111570797151",
      appId: "1:111570797151:web:5d23161a445c946ccb51ea"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    function getExactTime() {
      return new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
    }

    function formatExactLastSeen(timestamp) {
      if (!timestamp) return 'офлайн';
      const date = new Date(timestamp);
      return 'був(ла) о ' + date.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
    }

    // Екрани
    const authScreen = document.getElementById('auth-screen');
    const chatsScreen = document.getElementById('chats-screen');
    const chatScreen = document.getElementById('chat-screen');
    const settingsScreen = document.getElementById('settings-screen');

    // Кнопки навігації
    const openChatBtn = document.getElementById('open-chat-btn');
    const backBtn = document.getElementById('back-btn');
    const openSettingsBtn = document.getElementById('open-settings-btn');
    const closeSettingsBtn = document.getElementById('close-settings-btn');

    // Авторизація
    const authTitle = document.getElementById('auth-desc');
    const authName = document.getElementById('auth-name');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const authSubmitBtn = document.getElementById('auth-submit-btn');
    const authToggleBtn = document.getElementById('auth-toggle-btn');
    const authError = document.getElementById('auth-error');
    const logoutBtn = document.getElementById('logout-btn');

    let isSignUpMode = false;
    let currentUser = null;

    // Перемикання екранів
    openChatBtn.onclick = () => { chatsScreen.classList.remove('active'); chatScreen.classList.add('active'); };
    backBtn.onclick = () => { chatScreen.classList.remove('active'); chatsScreen.classList.add('active'); };
    openSettingsBtn.onclick = () => { chatsScreen.classList.remove('active'); settingsScreen.classList.add('active'); };
    closeSettingsBtn.onclick = () => { settingsScreen.classList.remove('active'); chatsScreen.classList.add('active'); };

    authToggleBtn.onclick = () => {
      isSignUpMode = !isSignUpMode;
      authError.textContent = '';
      if (isSignUpMode) {
        authTitle.textContent = 'Створіть свій акаунт';
        authName.style.display = 'block';
        authSubmitBtn.textContent = 'Зареєструватися';
        authToggleBtn.textContent = 'Вже є акаунт? Увійти';
      } else {
        authTitle.textContent = 'Увійдіть у свій акаунт';
        authName.style.display = 'none';
        authSubmitBtn.textContent = 'Увійти';
        authToggleBtn.textContent = 'Немає акаунту? Зареєструватися';
      }
    };

    authSubmitBtn.onclick = () => {
      const email = authEmail.value.trim();
      const password = authPassword.value.trim();
      const name = authName.value.trim();

      if (!email || !password) {
        authError.textContent = 'Заповніть всі поля';
        return;
      }

      if (isSignUpMode) {
        if (!name) { authError.textContent = "Введіть ім'я"; return; }
        auth.createUserWithEmailAndPassword(email, password)
          .then(userCredential => {
            database.ref('chats/' + userCredential.user.uid + '/profile').set({
              name: name,
              phone: '068 224 1029',
              email: email
            });
          })
          .catch(err => authError.textContent = err.message);
      } else {
        auth.signInWithEmailAndPassword(email, password)
          .catch(err => authError.textContent = 'Невірний email або пароль');
      }
    };

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        authScreen.classList.remove('active');
        chatsScreen.classList.add('active');

        // Відстеження статусу онлайн
        const userStatusRef = database.ref('chats/' + user.uid + '/status');
        database.ref('.info/connected').on('value', (snap) => {
          if (snap.val() === true) {
            userStatusRef.onDisconnect().set({ online: false, lastSeen: firebase.database.ServerValue.TIMESTAMP });
            userStatusRef.set({ online: true, lastSeen: firebase.database.ServerValue.TIMESTAMP });
          }
        });

        // Завантаження даних профілю у Налаштування
        database.ref('chats/' + user.uid + '/profile').on('value', snapshot => {
          const profile = snapshot.val();
          if (profile) {
            document.getElementById('user-display-name').textContent = profile.name || "Максим Ботнару";
            document.getElementById('user-display-phone').textContent = profile.phone || "068 224 1029";
            
            const avatarEl = document.getElementById('user-avatar');
            if (profile.avatarUrl) {
              avatarEl.innerHTML = `<img src="${profile.avatarUrl}">`;
            } else {
              avatarEl.innerHTML = (profile.name || "М").charAt(0).toUpperCase();
            }
          }
        });

        initChatLogic(user.uid);
      } else {
        currentUser = null;
        authScreen.classList.add('active');
        chatsScreen.classList.remove('active');
        chatScreen.classList.remove('active');
        settingsScreen.classList.remove('active');
      }
    });

    logoutBtn.onclick = () => auth.signOut();

    // Логіка чату
    function initChatLogic(uid) {
      const messagesContainer = document.getElementById('messages-container');
      const messageInput = document.getElementById('message-input');
      const sendBtn = document.getElementById('send-btn');
      const typingStatus = document.getElementById('typing-status');
      const listPreview = document.getElementById('list-preview');
      const listTime = document.getElementById('list-time');

      let typingTimeout = null;

      messageInput.oninput = () => {
        database.ref('chats/' + uid + '/userTyping').set(true);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          database.ref('chats/' + uid + '/userTyping').set(false);
        }, 1500);
      };

      database.ref('chats/' + uid + '/adminTyping').on('value', snapshot => {
        if (snapshot.val() === true) {
          typingStatus.textContent = 'друкує...';
          typingStatus.classList.add('typing');
        } else {
          database.ref('admin/status').on('value', statusSnap => {
            const st = statusSnap.val();
            if (st && st.online) typingStatus.textContent = 'онлайн';
            else if (st && st.lastSeen) typingStatus.textContent = formatExactLastSeen(st.lastSeen);
            else typingStatus.textContent = 'офлайн';
          });
          typingStatus.classList.remove('typing');
        }
      });

      database.ref('chats/' + uid + '/messages').on('value', snapshot => {
        messagesContainer.innerHTML = '';
        const data = snapshot.val();
        if (!data) return;

        const entries = Object.entries(data);
        if (entries.length > 0) {
          const last = entries[entries.length - 1][1];
          listPreview.textContent = last.text;
          listTime.textContent = last.timestamp || '';
        }

        entries.forEach(([msgId, msg]) => {
          const isMe = msg.sender === 'user';
          if (!isMe && msg.read === false) {
            database.ref('chats/' + uid + '/messages/' + msgId + '/read').set(true);
          }

          const msgDiv = document.createElement('div');
          msgDiv.className = 'msg ' + (isMe ? 'user' : 'admin');
          let ticksHtml = isMe ? (msg.read ? '<span style="color:#38bdf8;">✓✓</span>' : '<span style="color:#94a3b8;">✓</span>') : '';

          msgDiv.innerHTML = `
            <span>${msg.text}</span>
            <div class="msg-meta">
              <span>${msg.timestamp || ''}</span>
              ${ticksHtml}
            </div>
          `;
          messagesContainer.appendChild(msgDiv);
        });

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });

      function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        database.ref('chats/' + uid + '/userTyping').set(false);
        database.ref('chats/' + uid + '/messages').push({
          sender: 'user',
          text: text,
          timestamp: getExactTime(),
          read: false
        });

        messageInput.value = '';
      }

      sendBtn.onclick = sendMessage;
      messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
    }

    // Управління модальним вікном налаштувань
    function openProfileModal() {
      document.getElementById('edit-name').value = document.getElementById('user-display-name').textContent;
      document.getElementById('edit-phone').value = document.getElementById('user-display-phone').textContent;
      document.getElementById('profile-modal').classList.add('active');
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').classList.remove('active');
    }

    function saveProfile() {
      const name = document.getElementById('edit-name').value.trim();
      const phone = document.getElementById('edit-phone').value.trim();
      const avatarUrl = document.getElementById('edit-avatar-url').value.trim();

      if (currentUser) {
        database.ref('chats/' + currentUser.uid + '/profile').update({
          name: name,
          phone: phone,
          avatarUrl: avatarUrl
        });
      }
      closeProfileModal();
    }

    function openSection(title) {
      alert(`Розділ "${title}" у розробці`);
    }
  </script>
</body>
</html>
