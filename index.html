<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextTalk</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#17212b">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    body { background-color: #0e1621; color: #f5f5f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
    
    .chat-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #17212b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden; }

    /* --- ЕКРАН 1: СПИСОК ЧАТІВ --- */
    .chats-screen { display: flex; flex-direction: column; width: 100%; height: 100%; background: #17212b; }
    .main-header { padding: 14px 16px; background: #17212b; border-bottom: 1px solid #0e1621; display: flex; justify-content: space-between; align-items: center; }
    .main-title { font-size: 1.2rem; font-weight: 700; color: #ffffff; }
    
    .search-bar { padding: 8px 12px; background: #17212b; border-bottom: 1px solid #0e1621; }
    .search-input { width: 100%; padding: 8px 14px; background: #242f3d; border: none; border-radius: 18px; color: #fff; outline: none; font-size: 0.9rem; }
    .search-input::placeholder { color: #7f91a4; }

    .chats-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #0e1621; transition: background 0.2s; }
    .chat-item:hover { background: #202b36; }
    
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #64b5f6, #2196f3); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 1.2rem; flex-shrink: 0; overflow: hidden; background-size: cover; background-position: center; }
    .chat-item-info { flex: 1; overflow: hidden; }
    .chat-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .chat-item-name { font-size: 1rem; font-weight: 600; color: #fff; }
    .chat-item-time { font-size: 0.75rem; color: #7f91a4; }
    .chat-item-preview { font-size: 0.88rem; color: #7f91a4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* --- ЕКРАН 2: ВІКНО ЧАТУ --- */
    .chat-screen { display: none; flex-direction: column; width: 100%; height: 100%; background: #0e1621; }
    .chat-screen.active { display: flex; }

    .tg-header { padding: 10px 12px; background: #17212b; border-bottom: 1px solid #0e1621; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
    .back-btn { background: none; border: none; color: #64b5f6; font-size: 1.4rem; padding: 4px 8px; cursor: pointer; }
    .header-info { display: flex; flex-direction: column; justify-content: center; flex: 1; }
    .chat-title { font-size: 1rem; font-weight: 600; color: #ffffff; }
    .chat-subtitle { font-size: 0.82rem; color: #7f91a4; min-height: 1.1rem; }
    .chat-subtitle.typing { color: #64b5f6; font-weight: 500; }
    .edit-icon { font-size: 1.1rem; color: #7f91a4; padding: 4px; }

    .messages-container { 
      flex: 1; 
      padding: 16px 12px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
      background-color: #0e1621;
      background-image: radial-gradient(#17212b 1px, transparent 0);
      background-size: 16px 16px;
    }

    .msg { max-width: 78%; padding: 8px 12px; border-radius: 14px; font-size: 0.93rem; line-height: 1.35; word-wrap: break-word; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
    .msg.user { align-self: flex-end; background: #2b5278; color: #ffffff; border-bottom-right-radius: 4px; }
    .msg.admin { align-self: flex-start; background: #182533; color: #f5f5f5; border-bottom-left-radius: 4px; }

    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 3px; float: right; margin-left: 10px; margin-top: 4px; height: 14px; }
    .msg-time { font-size: 0.68rem; color: #7f91a4; }
    .msg.user .msg-time { color: #86a8c8; }
    .ticks { font-size: 0.75rem; color: #64b5f6; line-height: 1; }

    .input-container { padding: 10px 12px; background: #17212b; border-top: 1px solid #0e1621; display: flex; align-items: center; gap: 8px; }
    #message-input { flex: 1; padding: 10px 16px; background: #242f3d; border: 1px solid transparent; border-radius: 22px; color: #ffffff; outline: none; font-size: 0.95rem; }
    #message-input::placeholder { color: #7f91a4; }
    #message-input:focus { border-color: #64b5f6; }
    
    #send-btn { background: #5288c1; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    #send-btn svg { width: 18px; height: 18px; fill: white; margin-left: 2px; }

    /* МОДАЛЬНЕ ВІКНО */
    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(14, 22, 33, 0.85); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: #17212b; border: 1px solid #242f3d; border-radius: 14px; padding: 20px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6); }
    .modal-title { font-size: 1.05rem; font-weight: 600; color: #ffffff; border-bottom: 1px solid #242f3d; padding-bottom: 8px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.8rem; color: #7f91a4; }
    .form-group input { padding: 9px 12px; background: #242f3d; border: 1px solid #2b5278; border-radius: 8px; color: white; outline: none; font-size: 0.9rem; }
    .form-group input:focus { border-color: #64b5f6; }
    .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
    .btn { padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; font-size: 0.85rem; }
    .btn-secondary { background: #242f3d; color: #7f91a4; }
    .btn-primary { background: #5288c1; color: white; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #242f3d; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="chat-container">
    
    <!-- ЕКРАН 1: СПИСОК ЧАТІВ -->
    <div class="chats-screen" id="chats-screen">
      <div class="main-header">
        <div class="main-title">NextTalk</div>
        <div style="cursor: pointer;" id="open-settings-main">⚙️</div>
      </div>

      <div class="search-bar">
        <input type="text" class="search-input" placeholder="Пошук...">
      </div>

      <div class="chats-list">
        <div class="chat-item" id="open-chat-btn">
          <div class="avatar" id="list-avatar">М</div>
          <div class="chat-item-info">
            <div class="chat-item-top">
              <span class="chat-item-name" id="list-name">Максим</span>
              <span class="chat-item-time" id="list-time"></span>
            </div>
            <div class="chat-item-preview" id="list-preview">Натисніть, щоб відкрити чат</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ЕКРАН 2: ВІКНО ЧАТУ -->
    <div class="chat-screen" id="chat-screen">
      <div class="tg-header">
        <button class="back-btn" id="back-btn">←</button>
        <div class="avatar" id="header-avatar" style="width: 38px; height: 38px; font-size: 1rem;">М</div>
        <div class="header-info" id="chat-header">
          <div class="chat-title" id="header-name">Максим</div>
          <div class="chat-subtitle" id="typing-status">онлайн</div>
        </div>
        <div class="edit-icon" id="open-settings-chat">⚙️</div>
      </div>

      <div class="messages-container" id="messages-container"></div>

      <div class="input-container">
        <input type="text" id="message-input" placeholder="Повідомлення..." autocomplete="off">
        <button id="send-btn" title="Надіслати">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО -->
    <div class="modal-overlay" id="profile-modal">
      <div class="modal-card">
        <div class="modal-title">Профіль співрозмовника</div>
        
        <div class="form-group">
          <label for="edit-name">Ім'я:</label>
          <input type="text" id="edit-name" placeholder="Максим">
        </div>

        <div class="form-group">
          <label for="edit-status">Статус:</label>
          <input type="text" id="edit-status" placeholder="онлайн">
        </div>

        <div class="form-group">
          <label for="edit-avatar-url">Аватарка (mmm.jpg або 1 літера):</label>
          <input type="text" id="edit-avatar-url" placeholder="mmm.jpg">
        </div>

        <div class="modal-buttons">
          <button class="btn btn-secondary" id="close-modal-btn">Скасувати</button>
          <button class="btn btn-primary" id="save-profile-btn">Зберегти</button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBuGDd0y2y4Tkf-tcBU_ZshX2uUGK3uQWQ",
      authDomain: "my-website-5d781.firebaseapp.com",
      databaseURL: "https://my-website-5d781-default-rtdb.firebaseio.com",
      projectId: "my-website-5d781",
      storageBucket: "my-website-5d781.firebasestorage.app",
      messagingSenderId: "111570797151",
      appId: "1:111570797151:web:5d23161a445c946ccb51ea"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let userId = localStorage.getItem('nexttalk_user_id');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('nexttalk_user_id', userId);
    }

    let profileData = JSON.parse(localStorage.getItem('nexttalk_profile_data')) || {
      name: 'Максим',
      status: 'онлайн',
      avatar: 'М'
    };

    // Елементи переключення екранів
    const chatsScreen = document.getElementById('chats-screen');
    const chatScreen = document.getElementById('chat-screen');
    const openChatBtn = document.getElementById('open-chat-btn');
    const backBtn = document.getElementById('back-btn');

    openChatBtn.onclick = () => {
      chatsScreen.style.display = 'none';
      chatScreen.classList.add('active');
    };

    backBtn.onclick = () => {
      chatScreen.classList.remove('active');
      chatsScreen.style.display = 'flex';
    };

    // Елементи інтерфейсу
    const listName = document.getElementById('list-name');
    const listAvatar = document.getElementById('list-avatar');
    const listPreview = document.getElementById('list-preview');
    const listTime = document.getElementById('list-time');

    const headerName = document.getElementById('header-name');
    const headerAvatar = document.getElementById('header-avatar');
    const typingStatus = document.getElementById('typing-status');
    
    const profileModal = document.getElementById('profile-modal');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const saveProfileBtn = document.getElementById('save-profile-btn');
    const editName = document.getElementById('edit-name');
    const editStatus = document.getElementById('edit-status');
    const editAvatarUrl = document.getElementById('edit-avatar-url');

    function updateProfileUI() {
      listName.textContent = profileData.name;
      headerName.textContent = profileData.name;
      
      const av = profileData.avatar.trim();
      const isUrl = av.startsWith('http://') || av.startsWith('https://') || av.includes('.');
      
      if (isUrl) {
        listAvatar.style.backgroundImage = `url('${av}')`;
        listAvatar.textContent = '';
        headerAvatar.style.backgroundImage = `url('${av}')`;
        headerAvatar.textContent = '';
      } else {
        const char = (av || profileData.name.charAt(0)).toUpperCase();
        listAvatar.style.backgroundImage = 'none';
        listAvatar.textContent = char;
        headerAvatar.style.backgroundImage = 'none';
        headerAvatar.textContent = char;
      }
    }

    updateProfileUI();

    // Налаштування
    const openModal = () => {
      editName.value = profileData.name;
      editStatus.value = profileData.status;
      editAvatarUrl.value = profileData.avatar;
      profileModal.classList.add('active');
    };

    document.getElementById('open-settings-main').onclick = openModal;
    document.getElementById('open-settings-chat').onclick = openModal;
    closeModalBtn.onclick = () => profileModal.classList.remove('active');

    saveProfileBtn.onclick = () => {
      profileData.name = editName.value.trim() || 'Максим';
      profileData.status = editStatus.value.trim() || 'онлайн';
      profileData.avatar = editAvatarUrl.value.trim() || profileData.name.charAt(0);

      localStorage.setItem('nexttalk_profile_data', JSON.stringify(profileData));
      updateProfileUI();

      database.ref('chats/' + userId + '/profile').set({
        name: profileData.name,
        avatar: profileData.avatar
      });

      profileModal.classList.remove('active');
    };

    // Чат і повідомлення
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');

    let typingTimeout = null;

    messageInput.addEventListener('input', () => {
      database.ref('chats/' + userId + '/userTyping').set(true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        database.ref('chats/' + userId + '/userTyping').set(false);
      }, 1500);
    });

    database.ref('chats/' + userId + '/adminTyping').on('value', snapshot => {
      if (snapshot.val() === true) {
        typingStatus.textContent = 'друкує...';
        typingStatus.classList.add('typing');
      } else {
        typingStatus.textContent = profileData.status || 'онлайн';
        typingStatus.classList.remove('typing');
      }
    });

    database.ref('chats/' + userId + '/messages').on('value', snapshot => {
      messagesContainer.innerHTML = '';
      const data = snapshot.val();
      if (!data) return;

      const msgs = Object.values(data);
      if (msgs.length > 0) {
        const last = msgs[msgs.length - 1];
        listPreview.textContent = last.text;
        listTime.textContent = last.timestamp || '';
      }

      msgs.forEach(msg => {
        const isMe = msg.sender === 'user';
        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg ' + (isMe ? 'user' : 'admin');
        const ticksHtml = isMe ? '<span class="ticks">✓✓</span>' : '';
        
        msgDiv.innerHTML = `
          <span>${msg.text}</span>
          <div class="msg-meta">
            <span class="msg-time">${msg.timestamp || ''}</span>
            ${ticksHtml}
          </div>
        `;
        messagesContainer.appendChild(msgDiv);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      database.ref('chats/' + userId + '/userTyping').set(false);
      database.ref('chats/' + userId + '/messages').push({
        sender: 'user',
        text: text,
        timestamp: new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' })
      });

      messageInput.value = '';
    }

    sendBtn.onclick = sendMessage;
    messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
  </script>
</body>
</html>
