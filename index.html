<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextTalk</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#17212b">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0e1621; color: #f5f5f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
    
    .chat-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #17212b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden; }

    /* --- ЕКРАН АВТОРИЗАЦІЇ --- */
    .auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px 20px; height: 100%; background: #17212b; gap: 16px; text-align: center; }
    .auth-title { font-size: 1.5rem; font-weight: 700; color: #5288c1; margin-bottom: 8px; }
    .auth-desc { font-size: 0.9rem; color: #7f91a4; margin-bottom: 10px; }
    
    .auth-form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
    .auth-input { width: 100%; padding: 12px 16px; background: #242f3d; border: 1px solid #2b5278; border-radius: 10px; color: #fff; outline: none; font-size: 0.95rem; }
    .auth-input:focus { border-color: #64b5f6; }
    
    .auth-btn { padding: 12px; background: #5288c1; color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    .auth-btn:hover { background: #64b5f6; }
    .auth-toggle { font-size: 0.85rem; color: #64b5f6; cursor: pointer; margin-top: 6px; }
    .auth-error { color: #ff4d4d !important; font-size: 0.85rem; min-height: 1.2rem; }

    /* --- ЕКРАН СПИСКУ ЧАТІВ --- */
    .chats-screen { display: none; flex-direction: column; width: 100%; height: 100%; background: #17212b; }
    .main-header { padding: 14px 16px; background: #17212b; border-bottom: 1px solid #0e1621; display: flex; justify-content: space-between; align-items: center; }
    .main-title { font-size: 1.2rem; font-weight: 700; color: #ffffff; }
    
    .search-bar { padding: 8px 12px; background: #17212b; border-bottom: 1px solid #0e1621; }
    .search-input { width: 100%; padding: 8px 14px; background: #242f3d; border: none; border-radius: 18px; color: #fff; outline: none; font-size: 0.9rem; }

    .chats-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #0e1621; transition: background 0.2s; }
    .chat-item:hover { background: #202b36; }
    
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #64b5f6, #2196f3); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 1.2rem; flex-shrink: 0; overflow: hidden; background-size: cover; background-position: center; }
    .chat-item-info { flex: 1; overflow: hidden; }
    .chat-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .chat-item-name { font-size: 1rem; font-weight: 600; color: #fff; }
    .chat-item-time { font-size: 0.75rem; color: #7f91a4; }
    .chat-item-preview { font-size: 0.88rem; color: #7f91a4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* --- ЕКРАН ЧАТУ --- */
    .chat-screen { display: none; flex-direction: column; width: 100%; height: 100%; background: #0e1621; }
    .chat-screen.active { display: flex; }

    .tg-header { padding: 10px 12px; background: #17212b; border-bottom: 1px solid #0e1621; display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .back-btn { background: none; border: none; color: #64b5f6; font-size: 1.4rem; padding: 4px 8px; cursor: pointer; }
    .header-info { display: flex; flex-direction: column; justify-content: center; flex: 1; }
    .chat-title { font-size: 1rem; font-weight: 600; color: #ffffff; }
    .chat-subtitle { font-size: 0.82rem; color: #7f91a4; min-height: 1.1rem; }
    .chat-subtitle.typing { color: #64b5f6; font-weight: 500; }

    .messages-container { flex: 1; padding: 16px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-color: #0e1621; background-image: radial-gradient(#17212b 1px, transparent 0); background-size: 16px 16px; }
    .msg { max-width: 78%; padding: 8px 12px; border-radius: 14px; font-size: 0.93rem; line-height: 1.35; word-wrap: break-word; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
    .msg.user { align-self: flex-end; background: #2b5278; color: #ffffff; border-bottom-right-radius: 4px; }
    .msg.admin { align-self: flex-start; background: #182533; color: #f5f5f5; border-bottom-left-radius: 4px; }

    .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 3px; float: right; margin-left: 10px; margin-top: 4px; height: 14px; }
    .msg-time { font-size: 0.68rem; color: #7f91a4; }
    .msg.user .msg-time { color: #86a8c8; }
    .ticks { font-size: 0.75rem; color: #64b5f6; line-height: 1; }

    .input-container { padding: 10px 12px; background: #17212b; border-top: 1px solid #0e1621; display: flex; align-items: center; gap: 8px; }
    #message-input { flex: 1; padding: 10px 16px; background: #242f3d; border: 1px solid transparent; border-radius: 22px; color: #ffffff; outline: none; font-size: 0.95rem; }
    #message-input:focus { border-color: #64b5f6; }
    
    #send-btn { background: #5288c1; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    #send-btn svg { width: 18px; height: 18px; fill: white; margin-left: 2px; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #242f3d; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="chat-container">
    
    <!-- 1. ЕКРАН ВХОДУ / РЕЄСТРАЦІЇ -->
    <div class="auth-screen" id="auth-screen">
      <div class="auth-title">NextTalk</div>
      <div class="auth-desc" id="auth-desc">Увійдіть у свій акаунт</div>
      
      <div class="auth-form">
        <input type="text" id="auth-name" class="auth-input" placeholder="Ваше ім'я (для реєстрації)" style="display: none;">
        <input type="email" id="auth-email" class="auth-input" placeholder="Електронна пошта">
        <input type="password" id="auth-password" class="auth-input" placeholder="Пароль">
        
        <div class="auth-error" id="auth-error"></div>
        <button class="auth-btn" id="auth-submit-btn">Увійти</button>
      </div>

      <div class="auth-toggle" id="auth-toggle-btn">Немає акаунту? Зареєструватися</div>
    </div>

    <!-- 2. ЕКРАН СПИСКУ ЧАТІВ -->
    <div class="chats-screen" id="chats-screen">
      <div class="main-header">
        <div class="main-title">NextTalk</div>
        <div style="cursor: pointer; font-size: 0.85rem; color: #e53935;" id="logout-btn">Вийти</div>
      </div>

      <div class="search-bar">
        <input type="text" class="search-input" placeholder="Пошук...">
      </div>

      <div class="chats-list">
        <div class="chat-item" id="open-chat-btn">
          <div class="avatar">М</div>
          <div class="chat-item-info">
            <div class="chat-item-top">
              <span class="chat-item-name">Максим</span>
              <span class="chat-item-time" id="list-time"></span>
            </div>
            <div class="chat-item-preview" id="list-preview">Натисніть, щоб відкрити чат</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. ЕКРАН ЧАТУ -->
    <div class="chat-screen" id="chat-screen">
      <div class="tg-header">
        <button class="back-btn" id="back-btn">←</button>
        <div class="avatar" style="width: 38px; height: 38px; font-size: 1rem;">М</div>
        <div class="header-info">
          <div class="chat-title">Максим</div>
          <div class="chat-subtitle" id="typing-status">онлайн</div>
        </div>
      </div>

      <div class="messages-container" id="messages-container"></div>

      <div class="input-container">
        <input type="text" id="message-input" placeholder="Повідомлення..." autocomplete="off">
        <button id="send-btn" title="Надіслати">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBuGDd0y2y4Tkf-tcBU_ZshX2uUGK3uQWQ",
      authDomain: "my-website-5d781.firebaseapp.com",
      databaseURL: "https://my-website-5d781-default-rtdb.firebaseio.com",
      projectId: "my-website-5d781",
      storageBucket: "my-website-5d781.firebasestorage.app",
      messagingSenderId: "111570797151",
      appId: "1:111570797151:web:5d23161a445c946ccb51ea"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    const authScreen = document.getElementById('auth-screen');
    const authTitle = document.getElementById('auth-desc');
    const authName = document.getElementById('auth-name');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const authSubmitBtn = document.getElementById('auth-submit-btn');
    const authToggleBtn = document.getElementById('auth-toggle-btn');
    const authError = document.getElementById('auth-error');
    const logoutBtn = document.getElementById('logout-btn');

    const chatsScreen = document.getElementById('chats-screen');
    const chatScreen = document.getElementById('chat-screen');
    const openChatBtn = document.getElementById('open-chat-btn');
    const backBtn = document.getElementById('back-btn');

    let isSignUpMode = false;

    authToggleBtn.onclick = () => {
      isSignUpMode = !isSignUpMode;
      authError.textContent = '';
      if (isSignUpMode) {
        authTitle.textContent = 'Створіть свій акаунт';
        authName.style.display = 'block';
        authSubmitBtn.textContent = 'Зареєструватися';
        authToggleBtn.textContent = 'Вже є акаунт? Увійти';
      } else {
        authTitle.textContent = 'Увійдіть у свій акаунт';
        authName.style.display = 'none';
        authSubmitBtn.textContent = 'Увійти';
        authToggleBtn.textContent = 'Немає акаунту? Зареєструватися';
      }
    };

    authSubmitBtn.onclick = () => {
      const email = authEmail.value.trim();
      const password = authPassword.value.trim();
      const name = authName.value.trim();

      if (!email || !password) {
        authError.textContent = 'Заповніть всі поля';
        return;
      }

      authError.textContent = '';

      if (isSignUpMode) {
        if (!name) { 
          authError.textContent = "Введіть ваше ім'я"; 
          return; 
        }
        
        auth.createUserWithEmailAndPassword(email, password)
          .then(userCredential => {
            const user = userCredential.user;
            database.ref('chats/' + user.uid + '/profile').set({
              name: name,
              email: email
            });
          })
          .catch(err => authError.textContent = err.message);
      } else {
        auth.signInWithEmailAndPassword(email, password)
          .catch(err => authError.textContent = 'Невірний email або пароль');
      }
    };

    auth.onAuthStateChanged(user => {
      if (user) {
        authScreen.style.display = 'none';
        chatsScreen.style.display = 'flex';
        initChatLogic(user.uid);
      } else {
        authScreen.style.display = 'flex';
        chatsScreen.style.display = 'none';
        chatScreen.classList.remove('active');
      }
    });

    logoutBtn.onclick = () => auth.signOut();

    openChatBtn.onclick = () => {
      chatsScreen.style.display = 'none';
      chatScreen.classList.add('active');
    };

    backBtn.onclick = () => {
      chatScreen.classList.remove('active');
      chatsScreen.style.display = 'flex';
    };

    function initChatLogic(uid) {
      const messagesContainer = document.getElementById('messages-container');
      const messageInput = document.getElementById('message-input');
      const sendBtn = document.getElementById('send-btn');
      const typingStatus = document.getElementById('typing-status');
      const listPreview = document.getElementById('list-preview');
      const listTime = document.getElementById('list-time');

      let typingTimeout = null;

      messageInput.oninput = () => {
        database.ref('chats/' + uid + '/userTyping').set(true);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          database.ref('chats/' + uid + '/userTyping').set(false);
        }, 1500);
      };

      database.ref('chats/' + uid + '/adminTyping').on('value', snapshot => {
        if (snapshot.val() === true) {
          typingStatus.textContent = 'друкує...';
          typingStatus.classList.add('typing');
        } else {
          typingStatus.textContent = 'онлайн';
          typingStatus.classList.remove('typing');
        }
      });

      database.ref('chats/' + uid + '/messages').on('value', snapshot => {
        messagesContainer.innerHTML = '';
        const data = snapshot.val();
        if (!data) return;

        const msgs = Object.values(data);
        if (msgs.length > 0) {
          const last = msgs[msgs.length - 1];
          listPreview.textContent = last.text;
          listTime.textContent = last.timestamp || '';
        }

        msgs.forEach(msg => {
          const isMe = msg.sender === 'user';
          const msgDiv = document.createElement('div');
          msgDiv.className = 'msg ' + (isMe ? 'user' : 'admin');
          const ticksHtml = isMe ? '<span class="ticks">✓✓</span>' : '';
          
          msgDiv.innerHTML = `
            <span>${msg.text}</span>
            <div class="msg-meta">
              <span class="msg-time">${msg.timestamp || ''}</span>
              ${ticksHtml}
            </div>
          `;
          messagesContainer.appendChild(msgDiv);
        });

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });

      function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        database.ref('chats/' + uid + '/userTyping').set(false);
        database.ref('chats/' + uid + '/messages').push({
          sender: 'user',
          text: text,
          timestamp: new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' })
        });

        messageInput.value = '';
      }

      sendBtn.onclick = sendMessage;
      messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
    }
  </script>
</body>
</html>
