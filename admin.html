<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextTalk Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; }
    
    .sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; font-weight: bold; font-size: 1.2rem; color: #38bdf8; border-bottom: 1px solid #334155; }
    .user-list { flex: 1; overflow-y: auto; }
    .user-item { padding: 15px 20px; border-bottom: 1px solid #334155; cursor: pointer; transition: 0.2s; }
    .user-item:hover, .user-item.active { background: #334155; }
    .user-header-row { display: flex; justify-content: space-between; align-items: center; }
    .user-name { font-weight: bold; }
    .user-sub { font-size: 0.8rem; color: #94a3b8; margin-top: 5px; display: flex; justify-content: space-between; }

    /* Зелена крапка онлайн */
    .online-badge { display: inline-block; width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; margin-left: 6px; }

    .main-chat { flex: 1; display: flex; flex-direction: column; background: #0f172a; }
    .chat-header { padding: 15px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .msg.admin { align-self: flex-end; background: #0284c7; color: white; border-bottom-right-radius: 2px; }
    .msg.user { align-self: flex-start; background: #334155; color: white; border-bottom-left-radius: 2px; }
    .msg-meta { font-size: 0.7rem; opacity: 0.7; text-align: right; margin-top: 4px; }

    .input-area { padding: 20px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
    .input-field { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
    .btn { padding: 12px 24px; border-radius: 8px; border: none; background: #0284c7; color: white; font-weight: bold; cursor: pointer; }
    .btn:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">NextTalk Адмінка</div>
    <div id="user-list" class="user-list"></div>
  </div>

  <div class="main-chat">
    <div class="chat-header">
      <div>
        <div id="active-user-name" style="font-weight: bold;">Оберіть чат</div>
        <div id="active-user-status" style="font-size: 0.8rem; color: #38bdf8; margin-top: 2px;"></div>
      </div>
    </div>

    <div id="messages-container" class="messages-box"></div>

    <div class="input-area">
      <input type="text" id="message-input" class="input-field" placeholder="Напишіть відповідь..." disabled>
      <button id="send-btn" class="btn" disabled>Надіслати</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBuGDd0y2y4Tkf-tcBU_ZshX2uUGK3uQWQ",
      authDomain: "my-website-5d781.firebaseapp.com",
      databaseURL: "https://my-website-5d781-default-rtdb.firebaseio.com",
      projectId: "my-website-5d781",
      storageBucket: "my-website-5d781.firebasestorage.app",
      messagingSenderId: "111570797151",
      appId: "1:111570797151:web:5d23161a445c946ccb51ea"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function getExactTime() {
      return new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
    }

    function formatLastSeen(timestamp) {
      if (!timestamp) return 'офлайн';
      const date = new Date(timestamp);
      return 'був(ла) о ' + date.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
    }

    // Онлайн-статус самого Адміна
    const adminStatusRef = database.ref('admin/status');
    database.ref('.info/connected').on('value', (snap) => {
      if (snap.val() === true) {
        adminStatusRef.onDisconnect().set({ online: false, lastSeen: firebase.database.ServerValue.TIMESTAMP });
        adminStatusRef.set({ online: true, lastSeen: firebase.database.ServerValue.TIMESTAMP });
      }
    });

    const userListContainer = document.getElementById('user-list');
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const activeUserName = document.getElementById('active-user-name');
    const activeUserStatus = document.getElementById('active-user-status');

    let activeUid = null;
    let typingTimeout = null;
    let statusListenerRef = null;

    messageInput.oninput = () => {
      if (!activeUid) return;
      database.ref('chats/' + activeUid + '/adminTyping').set(true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        database.ref('chats/' + activeUid + '/adminTyping').set(false);
      }, 1500);
    };

    // Слухач списку чатів
    database.ref('chats').on('value', snapshot => {
      userListContainer.innerHTML = '';
      const chatsData = snapshot.val();
      if (!chatsData) return;

      Object.entries(chatsData).forEach(([uid, data]) => {
        const profile = data.profile || {};
        const name = profile.name || 'Користувач';
        const isOnline = data.status && data.status.online === true;
        
        let lastMsgText = 'Немає повідомлень';
        if (data.messages) {
          const msgs = Object.values(data.messages);
          lastMsgText = msgs[msgs.length - 1].text;
        }

        const userDiv = document.createElement('div');
        userDiv.className = 'user-item' + (uid === activeUid ? ' active' : '');
        userDiv.innerHTML = `
          <div class="user-header-row">
            <span class="user-name">${name}</span>
            ${isOnline ? '<span class="online-badge" title="В мережі"></span>' : ''}
          </div>
          <div class="user-sub">
            <span>${lastMsgText}</span>
            <span>${data.userTyping ? '<i style="color:#38bdf8;">друкує...</i>' : ''}</span>
          </div>
        `;

        userDiv.onclick = () => selectUser(uid, name);
        userListContainer.appendChild(userDiv);
      });
    });

    function selectUser(uid, name) {
      activeUid = uid;
      activeUserName.textContent = name;
      messageInput.disabled = false;
      sendBtn.disabled = false;

      document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));

      // Видаляємо попередній слухач статусу, якщо він був
      if (statusListenerRef) statusListenerRef.off();

      // Відстеження точного статусу обраного користувача в реальному часі
      statusListenerRef = database.ref('chats/' + uid + '/status');
      statusListenerRef.on('value', snap => {
        const st = snap.val();
        if (st && st.online === true) {
          activeUserStatus.textContent = 'онлайн';
          activeUserStatus.style.color = '#22c55e'; // Зелений колір для онлайн
        } else if (st && st.lastSeen) {
          activeUserStatus.textContent = formatLastSeen(st.lastSeen);
          activeUserStatus.style.color = '#94a3b8'; // Сірий колір
        } else {
          activeUserStatus.textContent = 'офлайн';
          activeUserStatus.style.color = '#94a3b8';
        }
      });

      // Завантажуємо повідомлення
      database.ref('chats/' + uid + '/messages').on('value', snapshot => {
        messagesContainer.innerHTML = '';
        const msgs = snapshot.val();
        if (!msgs) return;

        Object.values(msgs).forEach(msg => {
          const isAdmin = msg.sender === 'admin';
          const msgDiv = document.createElement('div');
          msgDiv.className = 'msg ' + (isAdmin ? 'admin' : 'user');
          msgDiv.innerHTML = `
            <span>${msg.text}</span>
            <div class="msg-meta">${msg.timestamp || ''}</div>
          `;
          messagesContainer.appendChild(msgDiv);
        });

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });
    }

    function sendAdminMessage() {
      const text = messageInput.value.trim();
      if (!text || !activeUid) return;

      database.ref('chats/' + activeUid + '/adminTyping').set(false);
      database.ref('chats/' + activeUid + '/messages').push({
        sender: 'admin',
        text: text,
        timestamp: getExactTime(),
        read: false
      });

      messageInput.value = '';
    }

    sendBtn.onclick = sendAdminMessage;
    messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendAdminMessage(); };
  </script>
</body>
</html>
